name: Release

on:
  push:
    branches: [main]

jobs:
  should-release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check commit message for conventional commit keywords
        id: check
        run: |
          msg="${{ github.event.head_commit.message }}"
          subject="$(echo "$msg" | head -1)"
          # Skip release commits to avoid recursive loops
          if echo "$subject" | grep -qE "^chore\(release\)"; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release commit"
          # Only release on conventional commits that affect version
          elif echo "$subject" | grep -qE "^(feat|fix|perf|docs|refactor|chore|test|build|ci|style|revert)(\([^)]+\))?!?:"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Commit matches conventional commit format"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Commit does not match conventional commit format"
          fi

  release:
    needs: should-release
    if: needs.should-release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DEEPSEEK_API_KEY: dummy
          KIMI_CODE_API_KEY: dummy
          SILICONFLOW_API_KEY: dummy
        run: pytest tests/ -v --cov=src/seven_bridges --cov-fail-under=80 --ignore=tests/agent-inference --ignore=tests/test_smoke_streaming.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
